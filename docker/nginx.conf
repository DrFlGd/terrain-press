server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/html text/css application/javascript application/json text/plain image/svg+xml;

    # elevation tiles rarely change: let browsers keep them a week
    location /data/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    # code and the catalogue: always check for a newer copy (cheap, uses ETags)
    location ~* \.(js|json|html)$ {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
