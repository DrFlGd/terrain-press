name: Windows portable release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'source/**'
      - 'site/**'
      - 'docs/TERRAIN-DATA-ROADMAP.md'
      - 'tools/io/**'
      - 'package.json'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out Terrain Press (including bundled terrain data)
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python for source build
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test dataset manager and desktop routing
        run: npm run test:desktop
      - name: Build checked-in source into distributable website
        run: python source/build.py
      - name: Build standalone Windows app
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Preserve portable EXE as downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terrain-Press-1.11.0-Portable-Windows
          path: dist/Terrain-Press-*-Portable.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.11.0
          name: Terrain Press Desktop v1.11.0 — Earth resolution upgrades — testing
          target_commitish: ${{ github.sha }}
          files: dist/Terrain-Press-*-Portable.exe
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          body: |
            Testing pre-release of the standalone portable 64-bit Windows edition of Terrain Press.
            Includes the new Earth terrain integration; Windows lifecycle and slicer acceptance are in progress.

            Download Terrain-Press-1.11.0-Portable.exe and run it without installing Node.js or Python.

            - NEW: Global Earth 30-arc-second upgrade (~925 m at the equator, 1.59 GB), alongside the existing 60-arc-second option.
            - NEW: Selected-area Earth downloads at 30 m or 90 m using public Copernicus surface data. Check availability and exact size before downloading.
            - Regional downloads support cancellation, resume, offline restart and removal. Missing cells fall back through installed terrain to the bundled base.
            - Copernicus is a surface model and may include buildings/vegetation. Public 30 m coverage has gaps; NOAA provides global ocean-floor relief.
            - Automated lifecycle/fallback tests and real native sample checks pass. Windows UI and slicer acceptance remain pending; this is a testing prerelease.
            - Unsigned executable: Windows SmartScreen may show a publisher warning.

            See docs/EARTH.md for provenance, reproduction and limitations.
            Source is provided under AGPL-3.0-or-later.
