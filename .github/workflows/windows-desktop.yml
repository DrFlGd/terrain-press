name: Windows portable release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'source/**'
      - 'site/**'
      - 'docs/TERRAIN-DATA-ROADMAP.md'
      - 'tools/io/**'
      - 'package.json'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out Terrain Press (including bundled terrain data)
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python for source build
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test dataset manager and desktop routing
        run: npm run test:desktop
      - name: Build checked-in source into distributable website
        run: python source/build.py
      - name: Build standalone Windows app
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Preserve portable EXE as downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terrain-Press-1.10.0-Portable-Windows
          path: dist/Terrain-Press-*-Portable.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.10.0
          name: Terrain Press Desktop v1.10.0 — Earth testing
          target_commitish: ${{ github.sha }}
          files: dist/Terrain-Press-*-Portable.exe
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          body: |
            Testing pre-release of the standalone portable 64-bit Windows edition of Terrain Press.
            Includes the new Earth terrain integration; Windows lifecycle and slicer acceptance are in progress.

            Download Terrain-Press-1.10.0-Portable.exe and run it without installing Node.js or Python.

            - NEW: Earth joins the seven existing offline worlds, with a bundled NOAA ETOPO 2022 terrain base and an elevation-colored globe.
            - NEW: Himalayas, Alps, Hawaii, Andes and Mariana Trench landmarks; arbitrary coordinates remain supported.
            - NEW: Optional Earth 60-arc-second global elevation upgrade (~466 MB / 444 MiB), checksum-pinned and available offline after installation.
            - Earth retains signed EGM2008 elevations, including ocean depths and ice surfaces. Grid spacing is not uniform survey accuracy.
            - Existing ornament, puzzle, STL/3MF/ZIP and source-aware mesh controls remain available.
            - Validation: full NOAA source acquired; cross-decoder mountain/ocean samples and finite STL/3MF geometry checked. Windows download/resume/offline/removal and slicer acceptance remain pending; Earth upgrade is beta.
            - Original Moon/Venus v1.9.2 download repairs and all existing planetary source integrations are retained.
            - Unsigned executable: Windows SmartScreen may show a publisher warning.

            See docs/EARTH.md for provenance, reproduction and limitations.
            Source is provided under AGPL-3.0-or-later.
