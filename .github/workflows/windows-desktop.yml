name: Windows portable release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'source/**'
      - 'site/**'
      - 'docs/TERRAIN-DATA-ROADMAP.md'
      - 'tools/io/**'
      - 'package.json'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out Terrain Press (including bundled terrain data)
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python for source build
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test dataset manager and desktop routing
        run: npm run test:desktop
      - name: Build checked-in source into distributable website
        run: python source/build.py
      - name: Build standalone Windows app
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Preserve portable EXE as downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terrain-Press-1.17.0-Portable-Windows
          path: dist/Terrain-Press-*-Portable.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.17.0
          name: Terrain Press Desktop v1.17.0 — Sharper Earth imagery — testing
          target_commitish: ${{ github.sha }}
          files: dist/Terrain-Press-*-Portable.exe
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          body: |
            Testing pre-release of the standalone portable 64-bit Windows edition of Terrain Press.
            Includes Jupiter globe selection and integrated ornament/puzzle exports. Windows UI and slicer acceptance remain pending.

            Download Terrain-Press-1.17.0-Portable.exe and run it without installing Node.js or Python.

            - NEW: Earth imagery at 21600 × 10800 for terrain painting (4× linear detail), with an 8K globe overview and offline tiles.
            - Earth, Mars, Mercury and Venus imagery painting with 2–8 editable colors; same colored 3MF workflow as the Moon. Mercury uses enhanced colors; Venus uses synthetic radar colors.
            - Moon terrain surface colors from offline 8192 × 4096 NASA SVS imagery, with 2–8 editable colors and colored 3MF exports.
            - Full 3600 × 1598 offline Jupiter imagery and color detail up to 512 cells across.
            - NEW: Jupiter standard workflow with offline Hubble OPAL imagery and 2–8 editable colors.
            - Frames, lettering, trays, hex grids, individual puzzle files, piece maps and colored print-guide previews.
            - Standard STL/3MF exports plus a shared manual filament-change schedule. 3MF surface colors are display assignments; slicer behavior varies.
            - Color-band heights are artistic construction, not gas-giant terrain.
            - Geometry/export regressions and browser smoke checks are included. Slicer and physical print acceptance remain pending.
            - Existing Earth global and selected-area terrain downloads remain available.
            - Unsigned executable: Windows SmartScreen may show a publisher warning.

            See docs/JUPITER-PANELS.md for provenance, printing instructions and limitations.
            Source is provided under AGPL-3.0-or-later; imagery has separate usage terms.
