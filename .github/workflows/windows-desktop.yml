name: Windows portable release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'source/**'
      - 'site/**'
      - 'docs/TERRAIN-DATA-ROADMAP.md'
      - 'package.json'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out Terrain Press (including bundled terrain data)
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python for source build
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test dataset manager and desktop routing
        run: npm run test:desktop
      - name: Build checked-in source into distributable website
        run: python source/build.py
      - name: Build standalone Windows app
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish downloadable Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.4.0
          name: Terrain Press Desktop v1.4.0
          target_commitish: ${{ github.sha }}
          files: dist/Terrain-Press-*-Portable.exe
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Standalone portable 64-bit Windows edition of Terrain Press.

            - Download Terrain-Press-1.4.0-Portable.exe and run it; no installation, server, Node.js, or Python required.
            - All elevation datasets, fonts, and JavaScript libraries are included for offline use.
            - Export print-ready STL/3MF/ZIP files using the same configurator as the web edition.
            - NEW: Terrain Data Manager displays bundled data, lets you choose an optional dataset folder, and supports checksum-verified future global tile packs.
            - NEW: Moon LOLA 128/256/512 px-per-degree native IMG files download directly from NASA PDS and remain available offline.
            - Source download sizes: 2.12 / 8.49 / 33.97 GB. Large-download end-to-end validation remains outstanding.
            - FIX: NASA PNG raster tiles now load correctly when switching away from 83 m landmark patches.
            - NEW: Optional Auto (source-matched) 3MF/STL detail scales the export sampling to installed terrain resolution, capped at 721 x 721; full spatial adaptive triangulation remains on the roadmap.
            - NEW: High-detail preview toggle renders the same mesh sampling as the selected export setting (including Auto), with a fast-preview default.
            - NEW: Terrain model width supports 60 to 1000 mm; the virtual preview plate and camera scale for oversized puzzles.
            - Unsigned executable: Windows SmartScreen may show a publisher warning.

            Source is provided in this repository under AGPL-3.0-or-later.
