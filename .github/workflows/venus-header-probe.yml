name: Venus PDS header probe
on:
  push:
    paths: ['.github/workflows/venus-header-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Read official NASA PDS4 metadata (no large IMG download)
        shell: bash
        run: |
          set -euo pipefail
          root='https://pds-geosciences.wustl.edu/mgn/urn-nasa-pds-magellan_stereo_topography/data'
          curl -fSL --retry 2 --max-time 40 "$root/mosaic_allstereo.hdr" -o hdr.txt
          curl -fSL --retry 2 --max-time 40 "$root/mosaic_allstereo.xml" -o lbl.xml
          echo '--- OFFICIAL ENVI HEADER ---'
          cat hdr.txt
          echo '--- PDS4 AXES AND TYPE / CONSTANTS / UNITS / PROJECTION ---'
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          tree=ET.parse('lbl.xml')
          for e in tree.iter():
              tag=e.tag.rsplit('}',1)[-1]
              if tag in ('name','axis_name','elements','data_type','value','unit','offset','scaling_factor','missing_constant',
                         'invalid_constant','error_constant','not_applicable_constant','unknown_constant','null_constant',
                         'semi_major_radius','semi_minor_radius','longitude_direction','longitude_domain',
                         'latitude_type','map_projection_name','longitude_of_central_meridian',
                         'latitude_of_projection_origin','pixel_resolution_x','pixel_resolution_y',
                         'spatial_resolution_x','spatial_resolution_y','array_axis_order','axis_index_order'):
                  text=(e.text or '').strip()
                  if text: print(tag,':',text[:160])
          PY
          echo '--- PDS XML RAW TAG SPELLING ---'
          grep -inE -C 1 '(value_offset|latitude_type|longitude_direction|pixel_resolution_x|data_type)' lbl.xml || true
          echo '--- PDS XML SOURCE METADATA (unit, special, fill, radius, value) ---'
          grep -iEn -C 2 'special_constants|missing|invalid|unknown|satur|error_constant|<unit>|<description>|offset|data_type|valid_minimum|valid_maximum' lbl.xml | tail -130 || true
          echo '--- NASA BYTE-RANGE PROBE (8 bytes, abort on full 2.97 GB response) ---'
          python3 - <<'PY'
          import urllib.request,struct
          root='https://pds-geosciences.wustl.edu/mgn/urn-nasa-pds-magellan_stereo_topography/data/mosaic_allstereo.img'
          cols=34505;rows=21549
          for x,y in [(0,0),(cols//2,rows//2),(cols//4,rows//4),(cols*3//4,rows//2),(cols//2,rows//4),(cols//3,rows*2//3)]:
            start=(y*cols+x)*4
            req=urllib.request.Request(root, headers={'Range':f'bytes={start}-{start+3}'})
            try:
              with urllib.request.urlopen(req,timeout=22) as r:
                print('sample',x,y,'HTTP',r.status,'range',r.headers.get('Content-Range'))
                if r.status!=206:print('Range unsupported - no bulk download');break
                raw=r.read(4)
                print(' value',struct.unpack('<f',raw)[0],raw.hex())
            except Exception as exc:print('Probe failure:',exc);break
          PY
